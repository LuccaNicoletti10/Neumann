[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neumann-planner"
version = "0.2.0"
description = "Planner de produção — ontologia, pipeline imutável e motor de decisão"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "polars>=1.0",
  "pandera[polars]>=0.20",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "apscheduler>=3.10",
  "ortools>=9.10",
  "statsforecast>=1.7",
  "streamlit>=1.32",
  "plotly>=5.18",
  "rich>=13.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.8",
  "ruff>=0.3",
]
ai = [
  "anthropic>=0.28",
]

[project.scripts]
planner = "planner.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
markers = [
  "unit: testes unitários",
  "integration: testes de integração",
  "slow: testes lentos",
]

[tool.ruff]
line-length = 100
target-version = "py312"
