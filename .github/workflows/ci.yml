name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install polars PyYAML pydantic pytest
      - name: Unit tests
        run: pytest -m "unit or not slow" -q --ignore=tests/test_validators_engine.py
      - name: Architecture check
        run: |
          if grep -R "nicoletti" planner/core --include='*.py' | grep -v 'Binary' | grep -v docstring | grep -v '#' ; then
            echo "core/ não pode conhecer o cliente"
            exit 1
          fi
          echo "OK: core limpo"
