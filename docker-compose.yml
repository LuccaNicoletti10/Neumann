services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner}
      POSTGRES_DB: ${POSTGRES_DB:-planner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - planner_pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sh:/docker-entrypoint-initdb.d/01_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner} -d ${POSTGRES_DB:-planner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  planner-api:
    build: .
    command: uvicorn planner.core.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-planner}:${POSTGRES_PASSWORD:-planner}@postgres:5432/${POSTGRES_DB:-planner}
      DATA_ROOT: /data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  planner-scheduler:
    build: .
    command: python -m planner schedule --client ${PLANNER_CLIENT:-nicoletti}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-planner}:${POSTGRES_PASSWORD:-planner}@postgres:5432/${POSTGRES_DB:-planner}
      DATA_ROOT: /data
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  planner-app:
    build: .
    command: streamlit run planner/app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-planner}:${POSTGRES_PASSWORD:-planner}@postgres:5432/${POSTGRES_DB:-planner}
      DATA_ROOT: /data
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  planner_pgdata:
